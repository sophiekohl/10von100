<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#641d2b"><title>10/100 Studio</title><style>
:root{--wine:#641d2b;--cream:#f5eee4;--ink:#2b2020;--muted:#806e68}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;min-height:100vh}.wrap{max-width:560px;margin:auto;padding:calc(34px + env(safe-area-inset-top)) 22px 50px}.brand{font:600 14px/1.2 Georgia,serif;letter-spacing:.18em;color:var(--wine)}h1{font:400 42px/1.05 Georgia,serif;margin:18px 0 8px;color:var(--wine)}.sub{color:var(--muted);line-height:1.55;margin:0 0 28px}.card{background:#fffaf3;border:1px solid #e5d8ca;border-radius:25px;padding:22px;box-shadow:0 12px 35px #4b172012}.label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:block;margin:18px 0 7px}input,select,textarea{width:100%;border:1px solid #dccdc1;background:white;border-radius:14px;padding:14px;font:inherit;color:var(--ink)}textarea{min-height:150px;resize:vertical}button{width:100%;border:0;border-radius:15px;padding:15px 18px;font-weight:650;font-size:15px;background:var(--wine);color:white;margin-top:18px}.ghost{background:transparent;color:var(--wine);border:1px solid #c9aeb1}.hidden{display:none}.msg{font-size:14px;line-height:1.45;margin-top:14px;color:var(--muted)}.row{display:flex;gap:10px}.row>*{flex:1}.check{display:flex;align-items:center;gap:10px;margin-top:17px}.check input{width:auto}.media{border:1px dashed #cbb6a9;border-radius:15px;padding:14px;margin-top:10px}.top{display:flex;justify-content:space-between;align-items:center}.top button{width:auto;margin:0;padding:9px 12px;background:transparent;color:var(--wine)}small{color:var(--muted)}</style></head><body><main class="wrap"><div class="brand">10 / 100 · STUDIO</div>
<section id="login"><h1>Dein geheimer Ort.</h1><p class="sub">Hier entsteht alles, was später auf ihn wartet.</p><div class="card"><label class="label">E-Mail</label><input id="email" type="email" value="sophiekohlsche@gmail.com"><label class="label" for="password">Passwort</label><input id="password" type="password" autocomplete="current-password" placeholder="Dein Studio-Passwort"><button id="passwordLogin">Mit Passwort anmelden</button><button id="magic" class="ghost">Alternativ: sicheren Login-Link senden</button><p id="loginMsg" class="msg">Du bekommst einen einmaligen Link per E-Mail. Danach bleibt dein iPhone angemeldet.</p></div></section>
<section id="studio" class="hidden"><div class="top"><div><h1 style="margin-bottom:4px">Neue Überraschung</h1><small>Für dich · nur im Studio sichtbar</small></div><button id="logout">Abmelden</button></div><div class="card" style="margin-top:24px">
<label class="label">Art</label><select id="kind"><option value="ueberraschung">Überraschung</option><option value="liebesnachricht">Liebesnachricht</option><option value="erinnerung">Erinnerung</option><option value="hinweis">Hinweis</option><option value="mission">Mission</option></select>
<div class="row"><div><label class="label">Datum</label><input id="date" type="date"></div><div><label class="label">Uhrzeit</label><input id="time" type="time" value="09:00"></div></div>
<label class="label">Titel nach Freischaltung</label><input id="title" placeholder="z. B. Für dich.">
<label class="label">Dein Text</label><textarea id="body" placeholder="Schreib einfach so, wie du es ihm sagen würdest …"></textarea>
<label class="label">Medien</label><div class="media"><input id="media" type="file" accept="image/*,video/*,audio/*" multiple><small>Fotos, Videos und Audio · mehrere Dateien möglich</small></div>
<label class="label">Optionales Teaserbild vor Freischaltung</label><input id="teaser" type="file" accept="image/*">
<label class="check"><input id="calendar" type="checkbox" checked> Tag im Jahreskalender dezent markieren</label>
<label class="check"><input id="push" type="checkbox"> Später Push-Benachrichtigung senden</label>
<label class="label">Push-Text (optional)</label><input id="pushText" placeholder="Ein neuer Hinweis wartet auf dich.">
<button id="save">Überraschung speichern</button><p id="saveMsg" class="msg"></p></div></section></main>
<script>
const API='https://estgcmkrlcrwwcrphvsy.supabase.co',KEY='sb_publishable_y7izNMEGlLbUyExk0K2RWA_RYvHTyhR',REDIRECT='https://sophiekohl.github.io/10von100/studio/';
const $=id=>document.getElementById(id);
$('magic').addEventListener('click',async function(){const btn=this,email=$('email').value.trim();btn.disabled=true;$('loginMsg').textContent='Link wird gesendet …';try{const r=await fetch(API+'/auth/v1/otp?redirect_to='+encodeURIComponent(REDIRECT),{method:'POST',headers:{'apikey':KEY,'Content-Type':'application/json'},body:JSON.stringify({email:email,create_user:false,gotrue_meta_security:{}})});if(!r.ok){let x={};try{x=await r.json()}catch(_){ }throw new Error(x.msg||x.message||('HTTP '+r.status))}$('loginMsg').textContent='Geschafft. Öffne jetzt den Link in deiner E-Mail.'}catch(e){$('loginMsg').textContent='Fehler: '+e.message}finally{btn.disabled=false}});

let session=null;
$('passwordLogin').addEventListener('click',async()=>{const btn=$('passwordLogin'),email=$('email').value.trim(),password=$('password').value;if(!email||!password){$('loginMsg').textContent='Bitte E-Mail und Passwort eingeben.';return}btn.disabled=true;$('loginMsg').textContent='Anmeldung läuft …';try{const x=await fetch(API+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email,password})});const data=await x.json();if(!x.ok)throw Error(data.msg||data.error_description||data.message||'Anmeldung fehlgeschlagen');session={access_token:data.access_token,refresh_token:data.refresh_token,expires_at:Math.floor(Date.now()/1000)+data.expires_in};sessionStorage.setItem('studioSession',JSON.stringify(session));$('password').value='';await validateSession()}catch(e){$('loginMsg').textContent='Login-Fehler: '+e.message}finally{btn.disabled=false}});
function showStudio(){ $('login').classList.add('hidden');$('studio').classList.remove('hidden'); }
function showLogin(){ $('studio').classList.add('hidden');$('login').classList.remove('hidden'); }
async function api(path,options={}){const headers={'apikey':KEY,'Content-Type':'application/json',...(session?{'Authorization':'Bearer '+session.access_token}:{}) ,...(options.headers||{})};const response=await fetch(API+path,{...options,headers});if(!response.ok){const body=await response.json().catch(()=>({}));throw new Error(body.message||body.msg||body.error_description||'HTTP '+response.status)}return response.status===204?null:response.json()}
async function validateSession(){if(!session?.access_token)return;try{const user=await api('/auth/v1/user');if(!user?.id)throw Error('Sitzung ungültig');const admin=await api('/rest/v1/admin_users?select=user_id&user_id=eq.'+encodeURIComponent(user.id));if(!Array.isArray(admin)||!admin.length)throw Error('Kein Studio-Zugriff für dieses Konto');showStudio()}catch(e){session=null;sessionStorage.removeItem('studioSession');showLogin();$('loginMsg').textContent='Anmeldung nicht möglich: '+e.message}}
(async()=>{try{const hash=new URLSearchParams(location.hash.slice(1));if(hash.has('error'))throw Error(hash.get('error_description')||hash.get('error'));if(hash.has('access_token')){session={access_token:hash.get('access_token'),refresh_token:hash.get('refresh_token'),expires_at:Math.floor(Date.now()/1000)+Number(hash.get('expires_in')||3600)};sessionStorage.setItem('studioSession',JSON.stringify(session));history.replaceState(null,'',location.pathname)}else{session=JSON.parse(sessionStorage.getItem('studioSession')||'null')}if(session?.refresh_token&&session.expires_at<Date.now()/1000+60){const renewed=await fetch(API+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{'apikey':KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:session.refresh_token})});if(renewed.ok){const x=await renewed.json();session={access_token:x.access_token,refresh_token:x.refresh_token,expires_at:Math.floor(Date.now()/1000)+x.expires_in};sessionStorage.setItem('studioSession',JSON.stringify(session))}}await validateSession()}catch(e){$('loginMsg').textContent='Login-Fehler: '+e.message;history.replaceState(null,'',location.pathname)}})();
$('logout').addEventListener('click',async()=>{const token=session?.access_token;session=null;sessionStorage.removeItem('studioSession');showLogin();if(token)fetch(API+'/auth/v1/logout',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+token}}).catch(()=>{});});
$('save').addEventListener('click',async()=>{const msg=$('saveMsg');msg.textContent='';if(!session){msg.textContent='Bitte erneut anmelden.';return}if($('media').files.length||$('teaser').files.length){msg.textContent='Medien-Uploads sind noch nicht freigeschaltet. Bitte zunächst ohne Dateien speichern.';return}const title=$('title').value.trim(),date=$('date').value,time=$('time').value;if(!title||!date||!time){msg.textContent='Bitte Titel, Datum und Uhrzeit ausfüllen.';return}const btn=$('save');btn.disabled=true;msg.textContent='Wird gespeichert …';try{await api('/rest/v1/content_items',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({title,kind:$('kind').value,body:$('body').value,unlock_at:new Date(date+'T'+time+':00').toISOString(),teaser_mode:'none',calendar_visible:$('calendar').checked,push_enabled:$('push').checked,push_text:$('pushText').value.trim()||null})});msg.textContent='Gespeichert! ♡';$('title').value='';$('body').value=''}catch(e){msg.textContent='Speichern fehlgeschlagen: '+e.message}finally{btn.disabled=false}});
</script></body></html>
